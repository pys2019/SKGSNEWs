name: publish-newsletter

# 생성은 사용자 PC의 Claude Code 예약 작업이 하고, 새 호를 push하면 이 워크플로가 게시와 메일 발송을 맡는다.
on:
  push:
    branches: [main]
    paths:
      - "issues/**"
  workflow_dispatch:
    inputs:
      test_only:
        description: "true면 pys2019@gmail.com 한 곳에만 테스트 메일을 보낸다"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.latest.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py
      - id: latest
        run: |
          mkdir -p issues
          echo "issue=$(ls issues | sort | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  mail:
    needs: [build, deploy]
    # push로 새 호가 올라왔을 때, 또는 수동 테스트일 때만 보낸다. 호가 비어 있는 push는 보내지 않는다.
    if: needs.build.outputs.issue != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ github.event_name == 'workflow_dispatch' && '[테스트] ' || '' }}[내부] 주간 강건재 이슈 ${{ needs.build.outputs.issue }}"
          to: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_only) && 'pys2019@gmail.com' || 'yespark@posco.com,pys2019@gmail.com' }}
          from: 주간 강건재 이슈 <${{ secrets.MAIL_USERNAME }}>
          body: |
            이번 주 강건재 이슈가 올라왔습니다. (내부 공유용)

            읽기: https://pys2019.github.io/SKGSNEWs/issues/${{ needs.build.outputs.issue }}.html
            전체 목록: https://pys2019.github.io/SKGSNEWs/
            원문(저장소): https://github.com/pys2019/SKGSNEWs/blob/main/issues/${{ needs.build.outputs.issue }}/newsletter.md
